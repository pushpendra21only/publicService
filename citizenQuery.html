<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Public Services — Citizen Query</title>
    <style>
      :root{
        --bg:#f5f8ff;
        --card:#ffffff;
        --accent-1:#0b63d6;
        --accent-2:#1e88e5;
        --muted:#536171;
        --radius:12px;
        --gap:18px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }

      *{box-sizing:border-box}
      html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#fff);color:#0b2236}
      .container{max-width:1100px;margin:28px auto;padding:20px}

      header{display:flex;align-items:center;justify-content:space-between;gap:16px}
      .brand{display:flex;align-items:center;gap:14px}
  .logo{width:56px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;border-radius:8px}
      h1{font-size:20px;margin:0}
      .sub{color:var(--muted);font-size:13px;margin-top:6px}

      .controls{display:flex;gap:12px;align-items:center;margin:20px 0}
      .search{flex:1}
      .search input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(11,99,214,0.08);font-size:14px}

      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--gap);align-items:stretch}
      .card{background:var(--card);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 20px rgba(16,40,80,0.06);border:1px solid rgba(11,99,214,0.04);transition:transform .18s ease,box-shadow .18s ease}
      .card:hover{transform:translateY(-8px);box-shadow:0 24px 40px rgba(16,40,80,0.08)}
      .card .title{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--accent-1)}
      .card .desc{color:var(--muted);font-size:13px}
      .card .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
      .link{background:transparent;border:none;color:var(--accent-2);text-decoration:underline;cursor:pointer;padding:6px 8px;border-radius:8px}

      footer{margin-top:26px;color:var(--muted);font-size:13px;text-align:center}

      /* modal */
      .overlay{position:fixed;inset:0;background:rgba(6,24,60,0.36);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
      .overlay.open{display:flex}
      .modal{width:100%;max-width:680px;background:var(--card);border-radius:12px;padding:20px;box-shadow:0 30px 80px rgba(8,24,64,0.28)}
      .modal h2{margin:0 0 8px}
      .modal p{color:var(--muted);margin:0 0 14px}
      .actions{display:flex;gap:10px;justify-content:flex-end}
      .btn{padding:8px 12px;border-radius:10px;border:none;cursor:pointer}
      .btn.primary{background:linear-gradient(90deg,var(--accent-1),var(--accent-2));color:white}
      .btn.ghost{background:transparent;border:1px solid rgba(11,99,214,0.06)}

      /* small helpers */
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

      @media (max-width:520px){
        .logo{width:48px;height:48px;font-size:16px}
        .controls{flex-direction:column;align-items:stretch}
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">
          <div class="logo">
            <img src="logo.png" alt="Public Services logo" />
          </div>
          <div>
            <h1>Public Services — Citizen Query</h1>
            <div class="sub">Choose a service below to view options, make payments or get help.</div>
          </div>
        </div>
        <nav aria-label="user quick actions">
          <!-- placeholder for future actions -->
        </nav>
      </header>

      <div class="controls">
        <div class="search">
          <label for="search" class="sr-only">Search services</label>
          <input id="search" type="search" placeholder="Search services (e.g. tax, pension)" />
        </div>
      </div>

      <main>
        <section class="grid" id="services" aria-label="Available services">
          <button class="card service" data-service="Tax">
            <div class="title"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2" fill="var(--accent-1)"/></svg>Tax</div>
            <div class="desc">Pay income, property and business taxes; view statements and deadlines.</div>
          </button>

          <button class="card service" data-service="Healthcare">
            <div class="title"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--accent-2)"/></svg>Healthcare</div>
            <div class="desc">Find clinics, book appointments, and access personal medical records.</div>
          </button>

          <button class="card service" data-service="Pension">
            <div class="title"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v18" stroke="var(--accent-1)" stroke-width="2" stroke-linecap="round"/></svg>Pension</div>
            <div class="desc">Manage pension plans, check balances and eligibility for benefits.</div>
          </button>

          <button class="card service" data-service="Transport">
            <div class="title"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2" fill="var(--accent-1)"/></svg>Transport</div>
            <div class="desc">Public transit passes, schedules, road permits and traffic updates.</div>
          </button>

          <button class="card service" data-service="Utilities">
            <div class="title"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2v20" stroke="var(--accent-2)" stroke-width="2" stroke-linecap="round"/></svg>Utilities</div>
            <div class="desc">Water, electricity and waste services: billing, outages and support.</div>
          </button>
        </section>
      </main>

      <footer>© <span id="year"></span> Public Services Portal</footer>
    </div>

    <div class="overlay" id="overlay" role="presentation">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="svc-title" aria-describedby="svc-desc">
        <h2 id="svc-title"></h2>
        <p id="svc-desc"></p>
        <div class="actions">
          <a id="svc-link" class="btn primary" href="#">Open service</a>
          <button id="svc-close" class="btn ghost">Close</button>
        </div>
      </div>
    </div>

    <script>
      // Redirect to login if not logged in
      if (!localStorage.getItem('ps_logged_in')) {
        window.location.href = 'login.html';
      }
      const services = {
        Tax: {desc: 'Pay taxes, view statements, and manage returns.', url:'#tax'},
        Healthcare: {desc: 'Book appointments, find clinics, and view records.', url:'#healthcare'},
        Pension: {desc: 'Manage contributions, check balances and apply for benefits.', url:'#pension'},
        Transport: {desc: 'Buy transit passes, check timetables, and road permits.', url:'#transport'},
        Utilities: {desc: 'Billing, report outages and request service support.', url:'#utilities'}
      };

      document.getElementById('year').textContent = new Date().getFullYear();

      const overlay = document.getElementById('overlay');
      const svcTitle = document.getElementById('svc-title');
      const svcDesc = document.getElementById('svc-desc');
      const svcLink = document.getElementById('svc-link');
      const svcClose = document.getElementById('svc-close');

      function openModal(name){
        const s = services[name] || {desc:'Details coming soon', url:'#'};
        svcTitle.textContent = name;
        svcDesc.textContent = s.desc;
        svcLink.href = s.url;
        overlay.classList.add('open');
        svcClose.focus();
      }
      function closeModal(){ overlay.classList.remove('open'); }

      document.querySelectorAll('.service').forEach(btn => {
        btn.addEventListener('click', ()=> openModal(btn.dataset.service));
      });
      svcClose.addEventListener('click', closeModal);
      overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
      document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

      // search filter
      const search = document.getElementById('search');
      search.addEventListener('input', ()=>{
        const q = search.value.trim().toLowerCase();
        document.querySelectorAll('.service').forEach(el=>{
          const name = el.dataset.service.toLowerCase();
          const desc = el.querySelector('.desc').textContent.toLowerCase();
          el.style.display = (q === '' || name.includes(q) || desc.includes(q)) ? '' : 'none';
        });
      });
    </script>
  </body>
</html>
